[package]
name = "app-license"
version = "0.1.0"
edition = "2021"
description = "Fast, offline Ed25519 license verification for sovereign desktop apps"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
