<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111827;font-family:system-ui,sans-serif}
nav{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid #e5e7eb;font-weight:600}
nav span{color:#2563eb}
.hero{padding:36px 20px 24px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.02em}
p{margin-top:12px;color:#4b5563;font-size:15px;line-height:1.5}
.btn{display:inline-block;margin-top:20px;background:#2563eb;color:#fff;padding:13px 20px;border-radius:8px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.card i{display:block;width:40px;height:40px;border-radius:10px;background:#d0603f}
.card b{display:block;margin-top:10px}
.card s{text-decoration:none;color:#6b7280;font-size:13px}
</style></head><body>
<nav>Storefront<span>Recover key</span></nav>
<div class="hero"><h1>Pro licenses for your desktop apps</h1><p>Pay with UPI or cards. Activate offline with a signed key.</p><span class="btn">Browse apps</span></div>
<div class="grid">
  <div class="card"><i></i><b>Orbit IDE</b><s>₹1,499</s></div>
  <div class="card"><i></i><b>Murmur</b><s>₹999</s></div>
  <div class="card"><i></i><b>Localboard</b><s>₹1,499</s></div>
  <div class="card"><i></i><b>Capturita</b><s>₹999</s></div>
</div>
</body></html>
