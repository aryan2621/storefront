        <circle cx="0" cy="64" r="2.6"/><circle cx="8" cy="64" r="2.6"/><circle cx="16" cy="64" r="2.6"/><circle cx="24" cy="64" r="2.6"/><circle cx="32" cy="64" r="2.6"/><circle cx="40" cy="64" r="2.6"/><circle cx="48" cy="64" r="2.6"/><circle cx="56" cy="64" r="2.6"/><circle cx="64" cy="64" r="2.6"/>
        <circle cx="0" cy="8" r="2.6"/><circle cx="0" cy="16" r="2.6"/><circle cx="0" cy="24" r="2.6"/><circle cx="0" cy="32" r="2.6"/><circle cx="0" cy="40" r="2.6"/><circle cx="0" cy="48" r="2.6"/><circle cx="0" cy="56" r="2.6"/>
